name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # The parser links libpg_query through cgo, so each platform is built on its
  # own runner rather than cross-compiled.
  binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            # musl gives a binary with no libc dependency at all.
            static: true
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: macos-13
            goos: darwin
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install musl toolchain
        if: matrix.static
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          LDFLAGS="-s -w \
            -X github.com/indexbeacon/indexbeacon/cmd.version=${VERSION} \
            -X github.com/indexbeacon/indexbeacon/cmd.commit=$(git rev-parse --short HEAD) \
            -X github.com/indexbeacon/indexbeacon/cmd.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "${{ matrix.static }}" = "true" ]; then
            export CC=musl-gcc
            LDFLAGS="$LDFLAGS -linkmode external -extldflags -static"
          fi
          mkdir -p dist
          go build -ldflags "$LDFLAGS" -o "dist/idxa" .
          ./dist/idxa version
          tar -czf "dist/idxa_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" -C dist idxa
          rm dist/idxa

      - uses: actions/upload-artifact@v4
        with:
          name: idxa_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*.tar.gz

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Publishing the container image needs registry credentials. Add
  # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN as repository secrets to enable it;
  # without them this job is skipped rather than failing the release.
  image:
    needs: binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - id: creds
        run: echo "present=${{ secrets.DOCKERHUB_USERNAME != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.creds.outputs.present != 'true'
        run: echo "No registry credentials configured; skipping the image." && exit 0
      - if: steps.creds.outputs.present == 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.creds.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.creds.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: steps.creds.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/idxa:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/idxa:latest
