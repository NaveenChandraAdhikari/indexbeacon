<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="IndexBeacon signal path from PostgreSQL workload observation to verified planner verdict">
  <title>IndexBeacon — from signal to safe decision</title>
  <desc>An animated beacon path connects five observability stages: capture workload signal, map query shape, model a candidate, weigh safety, and verify the planner verdict.</desc>
  <defs>
    <radialGradient id="pipe-bg" cx="50%" cy="0%"><stop stop-color="#112b35"/><stop offset="1" stop-color="#080f15"/></radialGradient>
    <linearGradient id="pipe-route" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#55e6bd"/><stop offset=".5" stop-color="#799cff"/><stop offset="1" stop-color="#f6c76d"/></linearGradient>
    <filter id="pipe-glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.p{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.pm{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.pt{fill:#e8f4f3}.ps{fill:#7e9ba5}.pc{fill:#0e2028;stroke:#294650}.pg{fill:#55e6bd}.pa{fill:#f6c76d}</style>
  </defs>
  <rect width="880" height="330" rx="16" fill="url(#pipe-bg)" stroke="#203843"/>
  <g class="p">
    <text x="36" y="40" class="pt" font-size="21" font-weight="700">THE SIGNAL PATH</text><text x="36" y="61" class="ps" font-size="11" letter-spacing="1.8">INDEXBEACON DECIDES WITH EVIDENCE</text>
    <g transform="translate(42 95)">
      <path d="M34 54 C148 5 246 105 348 54 S551 5 720 54" fill="none" stroke="#213c46" stroke-width="3"/>
      <path d="M34 54 C148 5 246 105 348 54 S551 5 720 54" fill="none" stroke="url(#pipe-route)" stroke-width="2" stroke-dasharray="9 12"><animate attributeName="stroke-dashoffset" from="0" to="-42" dur="3.2s" repeatCount="indefinite"/></path>
       <g transform="translate(0 0)"><circle cx="34" cy="54" r="18" class="pc"/><circle cx="34" cy="54" r="6" class="pg" filter="url(#pipe-glow)"/><text x="0" y="97" class="pt" font-size="13" font-weight="600">COLLECT</text><text x="0" y="116" class="ps" font-size="11">workload + catalog</text><text x="0" y="136" class="pm pg" font-size="10">stats · indexes · tables</text></g>
       <g transform="translate(172 0)"><circle cx="34" cy="54" r="18" class="pc"/><path d="M25 54h18M34 45v18" stroke="#799cff" stroke-width="2"/><text x="0" y="97" class="pt" font-size="13" font-weight="600">PARSE</text><text x="0" y="116" class="ps" font-size="11">PostgreSQL grammar</text><text x="0" y="136" class="pm" fill="#799cff" font-size="10">WHERE · JOIN · SORT</text></g>
       <g transform="translate(344 0)"><circle cx="34" cy="54" r="18" class="pc"/><path d="M25 61l9-14 9 14z" fill="none" stroke="#799cff" stroke-width="2"/><text x="0" y="97" class="pt" font-size="13" font-weight="600">GENERATE</text><text x="0" y="116" class="ps" font-size="11">candidate indexes</text><text x="0" y="136" class="pm" fill="#799cff" font-size="10">btree · gin · brin</text></g>
       <g transform="translate(516 0)"><circle cx="34" cy="54" r="18" class="pc"/><path d="M25 57h18M28 50h12" stroke="#f6c76d" stroke-width="2"/><text x="0" y="97" class="pt" font-size="13" font-weight="600">MERGE + SCORE</text><text x="0" y="116" class="ps" font-size="11">dedupe and rank</text><text x="0" y="136" class="pm pa" font-size="10">benefit · write · size</text></g>
       <g transform="translate(688 0)"><circle cx="34" cy="54" r="18" fill="#123b39" stroke="#55e6bd"/><path d="M25 54l6 6 12-14" fill="none" stroke="#55e6bd" stroke-width="2.5"/><text x="0" y="97" class="pt" font-size="13" font-weight="600">VALIDATE</text><text x="0" y="116" class="ps" font-size="11">HypoPG + re-plan</text><text x="0" y="136" class="pm pg" font-size="10">planner verdict</text></g>
    </g>
    <g transform="translate(42 267)"><rect width="796" height="36" rx="8" fill="#0b191f" stroke="#294650"/><circle cx="20" cy="18" r="5" class="pg"/><text x="36" y="22" class="pt" font-size="11">A recommendation is a reviewable finding — not an automatic schema change.</text><text x="758" y="22" class="pm pg" text-anchor="end" font-size="10">SAFE BY DEFAULT</text></g>
  </g>
</svg>
