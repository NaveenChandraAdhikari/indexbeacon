<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="IndexBeacon turns PostgreSQL workload evidence into a planner-verified index recommendation">
  <title>IndexBeacon — workload evidence to planner-verified index</title>
  <desc>A simple PostgreSQL performance diagram: query pressure enters from the left, IndexBeacon evaluates the evidence, and a planner-verified index tree appears on the right.</desc>
  <defs>
    <linearGradient id="hb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10252c"/>
      <stop offset="1" stop-color="#091116"/>
    </linearGradient>
    <linearGradient id="hb-flow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#61d8bd"/>
      <stop offset="1" stop-color="#83a9e8"/>
    </linearGradient>
    <filter id="hb-soft-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="260" rx="16" fill="url(#hb-bg)" stroke="#29434b"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="38" y="42" fill="#e9f4f1" font-size="27" font-weight="700" letter-spacing="-.8">INDEXBEACON</text>
    <text x="39" y="64" fill="#86a1a8" font-size="12" letter-spacing="2">POSTGRESQL PERFORMANCE EVIDENCE</text>

    <!-- Real input: the workload and query shape IndexBeacon observes. -->
    <g transform="translate(40 96)">
      <text fill="#7d9aa1" font-size="10" letter-spacing="1.5">INPUT / WORKLOAD</text>
      <text y="28" fill="#e9f4f1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">SELECT id, created_at</text>
      <text y="45" fill="#e9f4f1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">FROM orders</text>
      <text y="62" fill="#61d8bd" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">WHERE customer_id = $1</text>
      <text y="79" fill="#83a9e8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">ORDER BY created_at DESC</text>
      <line x1="0" y1="96" x2="256" y2="96" stroke="#28434b"/>
      <text y="116" fill="#f4c86b" font-size="11">4.6k calls · 1.8k seq scans</text>
    </g>

    <!-- Evidence path: simple, not decorative. -->
    <g transform="translate(318 142)">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#36525a" stroke-width="2"/>
      <path d="M100,-6 L112,0 L100,6 Z" fill="#61d8bd"/>
      <circle cx="44" cy="0" r="4" fill="#61d8bd" filter="url(#hb-soft-glow)">
        <animate attributeName="cx" values="0;100" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="-16" fill="#7d9aa1" font-size="10" letter-spacing="1.2">EVIDENCE</text>
      <text x="0" y="26" fill="#61d8bd" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">HypoPG + EXPLAIN</text>
    </g>

    <!-- Final result: an explicit tree-shaped index lookup path. -->
    <g transform="translate(480 82)">
      <text fill="#7d9aa1" font-size="10" letter-spacing="1.5">PLANNER-VERIFIED RESULT</text>
      <g transform="translate(28 24)">
        <!-- root -> branches -> leaves: a deliberately unmistakable tree -->
        <g fill="none" stroke="#3a5c64" stroke-width="2">
          <path d="M152 8 L92 54 M152 8 L212 54 M92 54 L54 104 M92 54 L130 104 M212 54 L174 104 M212 54 L250 104"/>
        </g>
        <g fill="#122a31" stroke="#61d8bd" stroke-width="1.8">
          <circle cx="152" cy="8" r="12">
          <animate attributeName="fill" values="#122a31;#1f5e57;#122a31" dur="2.4s" repeatCount="indefinite"/>
          </circle>
          <circle cx="92" cy="54" r="11"/>
          <circle cx="212" cy="54" r="11"/>
          <circle cx="54" cy="104" r="10"/>
          <circle cx="130" cy="104" r="10"/>
          <circle cx="174" cy="104" r="10"/>
          <circle cx="250" cy="104" r="10"/>
        </g>
      </g>
      <text x="0" y="244" fill="#e9f4f1" font-size="14" font-weight="600">orders_customer_date_idx</text>
      <text x="0" y="258" fill="#61d8bd" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">planner uses the path · cost 18 → 3</text>
    </g>

    <g transform="translate(748 36)">
      <circle cx="8" cy="8" r="5" fill="#61d8bd"/>
      <text x="20" y="12" fill="#61d8bd" font-size="10" letter-spacing="1.2">READ-ONLY</text>
    </g>
  </g>
</svg>
